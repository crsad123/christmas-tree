<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>伢姐一周年快乐</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" playsinline muted></video>
    <div class="veil" id="veil"></div>
    <h1>伢姐一周年快乐</h1>
    <button id="sound" type="button" aria-pressed="false" aria-label="铃">铃</button>
    <button id="letter-open" type="button">Jomin的信</button>
    <div id="letter" aria-hidden="true">
      <canvas id="letter-sky"></canvas>
      <article class="sheet">
        <h2>Jomin写给伢姐的信</h2>
        <p>正文先空着。</p>
        <p>想写的时候，再落到这里。</p>
        <button id="letter-close" type="button">合上</button>
      </article>
    </div>
    <button id="cam-ask" type="button" hidden>伸手</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
